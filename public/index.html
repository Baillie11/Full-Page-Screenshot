<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Page Screenshot App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .status.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .screenshots-section {
            margin-top: 30px;
        }

        .screenshots-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .screenshot-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            transition: transform 0.3s;
        }

        .screenshot-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .screenshot-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .screenshot-item .filename {
            font-size: 0.85rem;
            color: #666;
            word-break: break-all;
        }

        .screenshot-item a {
            display: inline-block;
            margin-top: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .toggle-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .toggle-btn .arrow {
            transition: transform 0.3s;
            font-size: 1.2rem;
        }

        .toggle-btn.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .job-info-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 1;
        }

        .job-info-content.hidden {
            max-height: 0;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Full-Page Screenshot</h1>
            <p>Capture complete webpage screenshots with a single click</p>
        </div>

        <div class="card">
            <button type="button" class="toggle-btn" id="toggleBtn">
                <span>Job Information</span>
                <span class="arrow">▼</span>
            </button>
            
            <div class="job-info-content" id="jobInfoContent">
                <form id="screenshotForm">
                <div class="form-group">
                    <label for="url">Website URL</label>
                    <input 
                        type="text" 
                        id="url" 
                        name="url" 
                        placeholder="https://example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="filename">Filename (optional)</label>
                    <input 
                        type="text" 
                        id="filename" 
                        name="filename" 
                        placeholder="my-screenshot.png"
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="captureBtn">
                        📸 Capture Screenshot
                    </button>
                    <button type="button" class="btn-secondary" id="refreshBtn">
                        🔄 Refresh List
                    </button>
                </div>

                <div id="status" class="status"></div>
            </form>
            </div>
        </div>

        <div class="card screenshots-section">
            <h2>Recent Screenshots</h2>
            <div id="screenshotGrid" class="screenshot-grid">
                <div class="empty-state">No screenshots yet. Capture your first one above!</div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('screenshotForm');
        const captureBtn = document.getElementById('captureBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const status = document.getElementById('status');
        const screenshotGrid = document.getElementById('screenshotGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const jobInfoContent = document.getElementById('jobInfoContent');

        // Load screenshots on page load
        loadScreenshots();

        // Handle toggle button
        toggleBtn.addEventListener('click', () => {
            jobInfoContent.classList.toggle('hidden');
            toggleBtn.classList.toggle('collapsed');
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const filename = document.getElementById('filename').value;

            // Show loading state
            captureBtn.disabled = true;
            captureBtn.innerHTML = '📸 Capturing... <span class="loader"></span>';
            showStatus('Capturing screenshot... This may take a few seconds.', 'loading');

            try {
                const response = await fetch('/api/capture', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url, filename })
                });

                const data = await response.json();

                if (data.success) {
                    showStatus(`✓ Screenshot saved as: ${data.filename}`, 'success');
                    form.reset();
                    loadScreenshots();
                } else {
                    showStatus(`✗ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus(`✗ Error: ${error.message}`, 'error');
            } finally {
                captureBtn.disabled = false;
                captureBtn.innerHTML = '📸 Capture Screenshot';
            }
        });

        // Handle refresh button
        refreshBtn.addEventListener('click', () => {
            loadScreenshots();
        });

        // Load and display screenshots
        async function loadScreenshots() {
            try {
                const response = await fetch('/api/screenshots');
                const data = await response.json();

                if (data.screenshots && data.screenshots.length > 0) {
                    screenshotGrid.innerHTML = data.screenshots.map(shot => `
                        <div class="screenshot-item">
                            <img src="${shot.url}" alt="${shot.filename}" loading="lazy">
                            <div class="filename">${shot.filename}</div>
                            <a href="${shot.url}" target="_blank">View Full Size</a>
                        </div>
                    `).join('');
                } else {
                    screenshotGrid.innerHTML = '<div class="empty-state">No screenshots yet. Capture your first one above!</div>';
                }
            } catch (error) {
                console.error('Error loading screenshots:', error);
            }
        }

        // Show status message
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
